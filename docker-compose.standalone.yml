# ============================================================
# docker-compose.yml — Solo la app (BD gestionada por Dokploy)
# ============================================================
# Usa este archivo si quieres que Dokploy gestione la BD como
# servicio separado. La BD se crea desde el panel de Dokploy.
#
# Para Dokploy:
#   1. Crear servicio "Compose" con este archivo
#   2. Crear servicio "Database" (MariaDB) desde el panel
#   3. Conectar ambos por red
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-animal-app
    restart: unless-stopped
    environment:
      # Variables inyectadas en config.php por docker-entrypoint.sh
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-erp_animal}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASS: ${DB_PASS:-changeme}
      TZ: ${TZ:-UTC}
    depends_on:
      - db
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mariadb:11
    container_name: erp-animal-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-erp_animal}
      MYSQL_USER: ${DB_USER:-erp_user}
      MYSQL_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  erp-network:
    driver: bridge