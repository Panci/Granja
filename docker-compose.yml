# ============================================================
# docker-compose.yml para Dokploy con SQLite
# ============================================================
# Sin network custom - usar la default de Dokploy (overlay)
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: granja-app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /app/data/erp_animal.db
    volumes:
      - granja-data:/app/data
    labels:
      # Traefik labels para Dokploy (Solo las basicas, sin network)
      - "traefik.enable=true"
      - "traefik.http.routers.granja-app.rule=Host(`granjavps-c04e16-186-240-144-11.sslip.io`)"
      - "traefik.http.routers.granja-app.entrypoints=web"
      - "traefik.http.routers.granja-app.priority=1"
      - "traefik.http.services.granja-app.loadbalancer.server.port=8080"

volumes:
  granja-data: