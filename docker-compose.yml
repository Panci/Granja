# ============================================================
# docker-compose.yml para Dokploy con SQLite
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: granja-app
    restart: unless-stopped
    ports:
      - "8080:8080"   # Necesario para que Dokploy/Traefik pueda conectar
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /app/data/erp_animal.db
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD antes de desplegar}
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET antes de desplegar}
    volumes:
      - granja-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  granja-data:
