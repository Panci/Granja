# ============================================================
# docker-compose.yml — Para Dokploy
# ============================================================
# Solo la app. La BD (si la quieres) la agregamos después.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-animal-app
    restart: unless-stopped
    # Publicar el puerto para que Traefik/Dokploy lo encuentre
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TZ: UTC
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  erp-network:
    driver: bridge