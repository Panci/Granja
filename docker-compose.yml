# ============================================================
# docker-compose.yml para Dokploy con SQLite
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: granja-app
    restart: unless-stopped
    ports:
      - "8080:8080"   # Necesario para que Dokploy/Traefik pueda conectar
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /app/data/erp_animal.db
    volumes:
      - granja-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  granja-data: