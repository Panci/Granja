# ============================================================
# docker-compose.yml — Para Dokploy con BD gestionada
# ============================================================
# Este compose SOLO incluye la app.
# La BD (MariaDB) se crea como servicio separado desde Dokploy.
#
# Dokploy automáticamente:
#   - Asigna un hostname al servicio de BD
#   - Configura Traefik para exponer la app
#   - Gestiona SSL/TLS
#
# Las variables ${...} las inyectas desde el panel de Dokploy.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-animal-app
    restart: unless-stopped
    # Exponer el puerto 80 para que Dokploy/Traefik pueda enrutarlo
    expose:
      - "80"
    environment:
      # Conexión a la BD gestionada por Dokploy
      # El hostname 'db' es el nombre del servicio MariaDB en Dokploy
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-erp_animal}
      DB_USER: ${DB_USER:-erp_user}
      DB_PASS: ${DB_PASS:-changeme}
      TZ: ${TZ:-UTC}
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  erp-network:
    driver: bridge