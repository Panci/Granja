# ============================================================
# docker-compose.yml para Dokploy con SQLite
# ============================================================
# Sin labels - Dokploy los añade via UI de Domains
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: granja-app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /app/data/erp_animal.db
    volumes:
      - granja-data:/app/data

volumes:
  granja-data: