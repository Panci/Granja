# ============================================================
# docker-compose.yml para Dokploy
# ============================================================
# App + MariaDB en la misma red Docker
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: granja-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: erp_user
      DB_PASS: Panci2015.M
      DB_NAME: erp_animal
    depends_on:
      - db
    networks:
      - granja-net

  db:
    image: mariadb:11
    container_name: granja-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: RootPanci2015
      MARIADB_DATABASE: erp_animal
      MARIADB_USER: erp_user
      MARIADB_PASSWORD: Panci2015.M
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - granja-net

networks:
  granja-net:
    driver: bridge

volumes:
  db-data: