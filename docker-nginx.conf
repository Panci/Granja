# ============================================================
# docker-nginx.conf — Configuración nginx para Dokploy
# ============================================================
# Sirve frontend estático + PHP-FPM para api.php
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Tamaño máximo de subida
    client_max_body_size 10M;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache para assets estáticos (1 año)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API PHP
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # Denegar acceso a archivos ocultos (.htaccess, .git, etc)
    location ~ /\.(ht|git|env) {
        deny all;
    }

    # Negar acceso a config.php y schema.sql
    location ~ (config\.php|config\.example\.php|schema\.sql|package\.json) {
        deny all;
    }

    # SPA fallback: redirigir todas las rutas a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Páginas de error amigables
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}