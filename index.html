<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ERP Animal — Sistema profesional de gestión veterinaria y cuidado animal. Control de inventario, salud, alimentación, reproducción, producción y finanzas.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ERP Animal — Gestión Veterinaria</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">
</head>
<body>

  <button class="theme-fab-static" id="themeFabStatic" onclick="App && App.toggleTheme && App.toggleTheme()" aria-label="Cambiar tema día/noche" title="Cambiar tema día/noche">
    <span id="themeFabStaticIcon">☀️</span>
  </button>

  <div id="app"></div>

  <script>
    // Aplica el tema antes del primer render para evitar un "flash" del tema oscuro.
    (function () {
      try {
        var stored = localStorage.getItem('erp_theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        // Actualiza el icono del botón estático para reflejar el tema actual.
        var icon = document.getElementById('themeFabStaticIcon');
        if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <script type="module" src="/main.js"></script>

</body>
</html>
